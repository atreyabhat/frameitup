<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Frame It Up renderer verification</title><link rel="stylesheet" href="/styles.css"><body><h1>Renderer verification</h1><p id="status">Running…</p><ul id="results"></ul><script type="module">
import {METADATA_FONTS, sanitizeSettings, planPhoto, photoRect, instagramSettings} from '/src/layout.mjs';
import {filmGeometry} from '/src/film.mjs';
import {renderSlide, encodeCanvas} from '/src/render.mjs';
const results = document.getElementById('results');
let passed = 0, failed = 0;
function check(condition, label) { const li = document.createElement('li'); li.textContent = `${condition ? 'PASS' : 'FAIL'}: ${label}`; results.append(li); condition ? passed++ : failed++; }
const source = document.createElement('canvas'); source.width = 1001; source.height = 667;
const ctx = source.getContext('2d', {colorSpace:'srgb'}), pixels = ctx.createImageData(1001,667);
for(let y=0;y<667;y++)for(let x=0;x<1001;x++){const i=(y*1001+x)*4;pixels.data[i]=x%256;pixels.data[i+1]=y%256;pixels.data[i+2]=(x+y)%256;pixels.data[i+3]=255;}
ctx.putImageData(pixels,0,0);
const item = {width:1001,height:667,image:source,average:'#cc8866',exif:null};
const equal=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
try {
  for(const count of ['2','3']) {
    const settings=sanitizeSettings({instagramReady:false, layout:count}), plan=planPhoto(item,settings), a=plan.slides[1];
    const strip=document.createElement('canvas');strip.width=a.width*Number(count);strip.height=a.height;
    const sc=strip.getContext('2d',{colorSpace:'srgb'});
    for(let i=0;i<Number(count);i++){const tile=await renderSlide(item,plan.slides[i+1],plan,settings);sc.drawImage(tile,i*a.width,0);}
    const rect=photoRect(item,a,plan,settings);
    check(equal(sc.getImageData(rect.x,rect.y,1001,667).data,pixels.data),`${count} slides preserve every source pixel and join without lost or repeated columns`);
  }
  for(const style of ['classic-white','classic-black','average','film-35mm']){
    const settings=sanitizeSettings({instagramReady:false, layout:'single',style,metadata:true,manual:'Camera | 35mm | f/2.8 | 1/125 | ISO 400'}),plan=planPhoto(item,settings,true),slide=plan.slides[0];
    const canvas=await renderSlide(item,slide,plan,settings),rect=photoRect(item,slide,plan,settings);
    check(equal(canvas.getContext('2d').getImageData(rect.x,rect.y,1001,667).data,pixels.data),`${style} keeps the photograph's decoded RGB pixels unchanged`);
    const blob=await encodeCanvas(canvas,'native');
    const decoded=await createImageBitmap(blob),again=document.createElement('canvas');again.width=decoded.width;again.height=decoded.height;again.getContext('2d').drawImage(decoded,0,0);decoded.close();
    check(blob.type==='image/png'&&equal(again.getContext('2d').getImageData(rect.x,rect.y,1001,667).data,pixels.data),`${style} PNG round trip is lossless`);
  }
  const settings=sanitizeSettings({instagramReady:true, export:'instagram',layout:'3'}),plan=planPhoto(item,settings);
  for(const slide of plan.slides){const canvas=await renderSlide(item,slide,plan,settings),blob=await encodeCanvas(canvas,'instagram'),decoded=await createImageBitmap(blob);check(blob.type==='image/jpeg'&&decoded.width===1080&&decoded.height===1440,`${slide.kind} JPEG is actually 1080 × 1440`);decoded.close();}
  const ready=instagramSettings(sanitizeSettings({export:'native'})),readyPlan=planPhoto(item,ready);
  check(readyPlan.slides[0].kind==='single','Auto format defaults to a single full image');
  for(const slide of readyPlan.slides){const canvas=await renderSlide(item,slide,readyPlan,ready),blob=await encodeCanvas(canvas,ready.export);check(blob.type==='image/png'&&canvas.width===1080&&canvas.height===1440,`${slide.kind} Auto format PNG uses 1080 × 1440 without lossy encoding`);}
  for (const name of ['landscape-valley.jpg','portrait-coast.jpg','square-mountain.jpg','panorama-trees.jpg','tall-snow.jpg']) {
    const image = new Image(); image.src = `/tests/fixtures/${name}`; await image.decode();
    const photo = {image,width:image.naturalWidth,height:image.naturalHeight,average:'#b8a48c',exif:null};
    const original=document.createElement('canvas');original.width=photo.width;original.height=photo.height;original.getContext('2d').drawImage(image,0,0);
    const rgb=original.getContext('2d').getImageData(0,0,photo.width,photo.height).data;
    for(const ratio of ['adaptive','square']) for(const filmBackground of ['white','black']) {
      const settings=sanitizeSettings({instagramReady:false, style:'film-35mm',filmBackground,border:8,ratio,layout:'single'});
      const plan=planPhoto(photo,settings),slide=plan.slides[0],canvas=await renderSlide(photo,slide,plan,settings),r=photoRect(photo,slide,plan,settings);
      const c=canvas.getContext('2d');
      check(equal(c.getImageData(r.x,r.y,photo.width,photo.height).data,rgb),`${name}/${ratio}/${filmBackground}: film and mat leave decoded photo pixels unchanged`);
      {
        const pixel=Array.from(c.getImageData(0,0,1,1).data);
        check(equal(pixel,filmBackground==='white'?[255,255,255,255]:[17,17,16,255]),`${name}/${ratio}/${filmBackground}: outer mat uses selected background`);
        const hole=filmGeometry(r,plan.film).holes[0];
        check(equal(Array.from(c.getImageData(Math.round(hole.x+hole.width/2),Math.round(hole.y+hole.height/2),1,1).data),filmBackground==='white'?pixel:[240,232,216,255]),`${name}/${ratio}/${filmBackground}: perforations remain visible against the mat`);
      }
      canvas.width=canvas.height=1;
    }
    original.width=original.height=1;
  }
  const filmSettings=sanitizeSettings({instagramReady:false,style:'film-35mm',ratio:'square',filmBackground:'white',layout:'single'});
  const filmPlan=planPhoto(item,filmSettings), filmSlide=filmPlan.slides[0];
  const first=await renderSlide({...item,filmSeed:42},filmSlide,filmPlan,filmSettings);
  const repeat=await renderSlide({...item,filmSeed:42},filmSlide,filmPlan,filmSettings);
  const variation=await renderSlide({...item,filmSeed:89721},filmSlide,filmPlan,filmSettings);
  const filmPixels=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  check(equal(filmPixels(first),filmPixels(repeat)),'Film patina and lettering remain identical across repeated exports');
  check(!equal(filmPixels(first),filmPixels(variation)),'Film patina and lettering vary with each photo seed');
  for (const ratio of ['portrait','square','landscape','adaptive']) {
    const settings=sanitizeSettings({instagramReady:false,layout:'detail',ratio,detailX:1,detailY:0,detailZoom:2,metadata:true,manual:'Must not appear on detail',style:'film-35mm'});
    const plan=planPhoto(item,settings,true),slide=plan.slides[1],rect=photoRect(item,slide,plan,settings);
    const canvas=await renderSlide(item,slide,plan,settings),crop=rect.crop;
    const expected=ctx.getImageData(crop.x,crop.y,crop.width,crop.height).data;
    check(equal(canvas.getContext('2d').getImageData(0,0,crop.width,crop.height).data,expected),`${ratio}: detail exports the exact selected source pixels with no film or footer overlay`);
    const blob=await encodeCanvas(canvas,'native'),decoded=await createImageBitmap(blob);
    check(decoded.width===crop.width&&decoded.height===crop.height,`${ratio}: native detail uses original crop resolution`);decoded.close();
  }
  const detailSettings=sanitizeSettings({layout:'detail',ratio:'portrait',detailX:0,detailY:1}),detailPlan=planPhoto(item,detailSettings);
  const detailCanvas=await renderSlide(item,detailPlan.slides[1],detailPlan,detailSettings),detailRect=photoRect(item,detailPlan.slides[1],detailPlan,detailSettings);
  check(detailCanvas.width===1080&&detailCanvas.height===1440&&detailRect.scale>1,'Explicit detail crop fills the output even for a small source');
  const squareFilm=sanitizeSettings({style:'film-35mm',instagramReady:false,corners:25,ratio:'square'});
  const squareFilmPlan=planPhoto(item,squareFilm),squareFilmCanvas=await renderSlide(item,squareFilmPlan.slides[0],squareFilmPlan,squareFilm),squareFilmRect=photoRect(item,squareFilmPlan.slides[0],squareFilmPlan,squareFilm);
  check(equal(squareFilmCanvas.getContext('2d').getImageData(squareFilmRect.x,squareFilmRect.y,item.width,item.height).data,pixels.data),'Film ignores rounded corners and preserves all photo corner pixels');
  const fontRenders = new Set();
  for (const metadataFont of METADATA_FONTS) {
    const settings=sanitizeSettings({style:'classic-white',ratio:'square',layout:'single',metadata:true,manual:'FUJIFILM X-T5 | 50mm | f/2.8 | 1/250 | ISO 200',metadataFont,fontStep:8});
    const plan=planPhoto(item,settings,true),slide=plan.slides[0];
    const canvas=await renderSlide(item,slide,plan,settings);
    check(document.fonts.check(`400 24px "${metadataFont}"`),`${metadataFont} loads before footer rendering`);
    const blob=await encodeCanvas(canvas,'native'),bitmap=await createImageBitmap(blob);
    check(bitmap.width===1080&&bitmap.height===1080,`${metadataFont} exports a decodable PNG`);bitmap.close();
    fontRenders.add(canvas.toDataURL());
  }
  check(fontRenders.size===METADATA_FONTS.length,'Every metadata font produces distinct rendered text');
  try{await renderSlide(item,{width:20000,height:20000,kind:'single'},plan,settings);check(false,'Oversized exports must fail');}catch{check(true,'Oversized native export fails explicitly instead of silently downsizing');}
}catch(error){check(false,error.stack);}
document.getElementById('status').textContent=`${passed} passed, ${failed} failed`;
</script></body></html>
